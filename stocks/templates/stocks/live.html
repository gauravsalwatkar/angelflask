<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Buys</title>
<style>
  :root {
    --bg: #f5f8fd; --surface: #ffffff; --surface-2: #eef3fb; --border: #dbe4f1;
    --text: #0f1b33; --muted: #5b6b85; --accent: #1d4ed8;
    --ok: #15803d; --ok-bg: #e8f7ee; --err: #dc2626; --err-bg: #fdecec; --warn-bg: #eaf1ff;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --surface: #111a2e; --surface-2: #17223a; --border: #24324f;
      --text: #e7edf8; --muted: #9aa8c2; --accent: #60a5fa;
      --ok: #4ade80; --ok-bg: #0f2d1d; --err: #f87171; --err-bg: #3a1618; --warn-bg: #15264a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 14px 20px;
           background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; }
  header h1 { margin: 0; font-size: 20px; }
  .pill { border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 600; background: var(--surface-2); }
  .pill.buy { background: var(--ok-bg); color: var(--ok); }
  .pill.avoid { background: var(--err-bg); color: var(--err); }
  .pill.live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                       background: var(--ok); margin-right: 6px; vertical-align: 1px; }
  .pill.off::before { background: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  header a { margin-left: auto; color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 18px 20px 40px; }
  h2 { font-size: 16px; margin: 22px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .card.buy { border-left: 4px solid var(--ok); }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-head h3 { margin: 0; font-size: 19px; }
  .price { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-left: auto; }
  .chg.pos { color: var(--ok); } .chg.neg { color: var(--err); }
  .new { background: var(--accent); color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 700; }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
  .levels div { background: var(--surface-2); border-radius: 6px; padding: 5px 8px; }
  .levels b { display: block; font-variant-numeric: tabular-nums; }
  .levels span { color: var(--muted); font-size: 11px; }
  ul.checks { list-style: none; margin: 6px 0; padding: 0; font-size: 13px; }
  ul.checks li { padding: 2px 0; }
  ul.checks .y { color: var(--ok); font-weight: 700; } ul.checks .n { color: var(--err); font-weight: 700; }
  ul.checks .opt { color: var(--muted); }
  details { margin-top: 6px; font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); }
  details ul { padding-left: 18px; margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius); overflow: hidden; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { background: var(--surface-2); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .decision { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .decision.BUY { background: var(--ok-bg); color: var(--ok); }
  .decision.WAIT { background: var(--warn-bg); color: var(--text); }
  .decision.AVOID { background: var(--err-bg); color: var(--err); }
  tr.BUY td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
  .empty { background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
           padding: 22px; text-align: center; color: var(--muted); }
  .err { background: var(--err-bg); color: var(--err); border-radius: 6px; padding: 10px 12px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  select { font: inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  nav.tabs { display: flex; gap: 4px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav.tabs button { font: inherit; font-weight: 600; background: none; border: 0; border-bottom: 2px solid transparent;
                    color: var(--muted); padding: 10px 14px; cursor: pointer; }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .decision.ADD { background: var(--ok-bg); color: var(--ok); }
  .decision.HOLD, .decision.BOOK { background: var(--surface-2); color: var(--text); }
  .decision.EXIT, .decision.SKIP { background: var(--err-bg); color: var(--err); }
  tr.ADD td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
  .card.ADD, .card.BUY { border-left: 4px solid var(--ok); }
  .advice { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; font-size: 13px; margin: 8px 0; }
  .chart { position: relative; margin: 8px 0; }
  .chart svg { display: block; width: 100%; height: auto; touch-action: none; }
  .chart .grid line { stroke: var(--border); stroke-width: 1; }
  .chart .axis text, .chart .lvl text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .price { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .lvl line { stroke-width: 1.5; }
  .chart .lvl.entry line { stroke: var(--text); stroke-dasharray: 6 4; }
  .chart .lvl.stop line { stroke: #d03b3b; stroke-dasharray: 6 4; }
  .chart .lvl.trail line { stroke: #ec835a; stroke-dasharray: 2 3; }
  .chart .lvl.target line { stroke: #0ca30c; stroke-dasharray: 2 3; }
  .chart .lvl.entry text { fill: var(--text); font-weight: 600; }
  .chart .cross { stroke: var(--muted); stroke-width: 1; }
  .chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.12);
         font-variant-numeric: tabular-nums; }
  .odds { font-size: 13px; margin: 6px 0; }
  .odds b.pos { color: var(--ok); } .odds b.neg { color: var(--err); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: 3px; margin-right: 5px; }
  @media (max-width: 600px) {
    nav.tabs { padding: 0 16px; }
    header, main { padding-left: 16px; padding-right: 16px; }
    .grid { grid-template-columns: 1fr; }
    .levels { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>Live buys</h1>
  <span class="pill off" id="feed">connecting…</span>
  <span class="pill buy" id="n-buy">BUY –</span>
  <span class="pill" id="n-wait">WAIT –</span>
  <span class="pill avoid" id="n-avoid">AVOID –</span>
  <span class="muted" id="clock"></span>
  <label class="muted" data-only="equity">Scan top <select id="count"><option>10</option><option selected>20</option></select> picks</label>
  <label class="muted" data-only="options" hidden>Index <select id="underlying"><option value="NIFTY">Nifty</option><option value="BANKNIFTY">Bank Nifty</option></select></label>
  <a href="{{ urls.dashboard }}">← Dashboard</a>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="equity" aria-selected="true">Equity</button>
  <button role="tab" data-tab="options" aria-selected="false">Options</button>
</nav>

<main>
  <div id="error"></div>
  <section data-panel="equity">
  <h2>Buy now</h2>
  <div id="buy"><div class="empty"><span class="spinner"></span>Scanning today's picks… the first load takes up to a minute.</div></div>
  <h2>All picks: buy or not</h2>
  <div id="all"></div>
  </section>
  <section data-panel="options" hidden>
    <p class="muted" id="opt-index"></p>
    <h2>All option legs: buy or not</h2>
    <div id="opt-table"><div class="empty"><span class="spinner"></span>Loading option levels…</div></div>
    <div id="opt-cards"></div>
  </section>
  <p class="muted" id="foot" style="margin-top:22px"></p>
</main>

<script>
(() => {
  const URL_EQUITY = "{{ urls.liveEquity }}";
  const URL_OPTIONS = "{{ urls.liveOptions }}";
  let tab = "equity";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const num = v => v == null ? "–" : Number(v).toLocaleString("en-IN", { maximumFractionDigits: 2 });
  const chg = v => v == null ? "" : `<span class="chg ${v >= 0 ? "pos" : "neg"}">${v >= 0 ? "+" : ""}${v}%</span>`;
  let seenBuy = null;  // symbols that were BUY on the previous refresh
  let busy = false;

  function checks(list) {
    return `<ul class="checks">${list.map(c =>
      `<li><span class="${c.ok ? "y" : c.required ? "n" : "opt"}">${c.ok ? "✓" : "✗"}</span> <b>${esc(c.name)}</b>` +
      `${c.required ? "" : ' <span class="opt">(info)</span>'}: ${esc(c.detail)}</li>`).join("")}</ul>`;
  }

  const money = v => v == null ? "–" : `₹${Number(v).toLocaleString("en-IN", { maximumFractionDigits: 0 })}`;

  // The time machine's odds for the daily plan (target first / stop first / still open after 20 sessions).
  function odds(sim) {
    if (!sim) return "";
    if (sim.error) return `<p class="odds muted">Time machine: ${esc(sim.error)}</p>`;
    const s = sim.simulation, h = sim.history;
    return `<p class="odds">Time machine (${s.trades.toLocaleString("en-IN")} replays): target first <b class="pos">${s.target_first_pct}%</b>,
      stop first <b class="neg">${s.stop_first_pct}%</b>, open ${s.still_open_pct}%` +
      (h ? ` · past ${h.trades} days: ${h.target_first_pct}% / ${h.stop_first_pct}%` : "") +
      `<br><span class="muted">${esc(sim.verdict)}</span></p>`;
  }

  function buyCard(r, isNew) {
    return `<div class="card buy">
      <div class="card-head"><h3>${esc(r.symbol)}</h3>${isNew ? '<span class="new">NEW</span>' : ""}
        <span class="muted">${esc(r.exchange)} · BUY since ${esc(r.buy_since)}</span>
        <span class="price">${num(r.ltp)} ${chg(r.change_pct)}</span></div>
      <div class="levels">
        <div><b>${num(r.max_buy_price)}</b><span>buy up to</span></div>
        <div><b>${num(r.stop_loss)}</b><span>stop loss</span></div>
        <div><b>${num(r.target)}</b><span>target</span></div>
        <div><b>${r.live_reward_to_risk ?? "–"}</b><span>reward:risk</span></div>
        <div><b>${num(r.vwap)}</b><span>VWAP</span></div>
        <div><b>${num(r.open)}</b><span>today's open</span></div>
        <div><b>${num(r.planned_buy)}</b><span>last close</span></div>
        <div><b>${r.gap_pct ?? "–"}%</b><span>opening gap</span></div>
        <div><b>${r.position ? r.position.qty : "–"}</b><span>qty to buy</span></div>
        <div><b>${money(r.position?.cost)}</b><span>cost</span></div>
        <div><b>${money(r.position?.max_loss)}</b><span>loss at stop</span></div>
      </div>
      ${odds(r.simulation)}
      <b>Why buy now</b>${checks(r.checks)}
      <details open><summary>Why it was picked</summary><ul>${r.why_picked.map(w => `<li>${esc(w)}</li>`).join("")}</ul></details>
      <details><summary>Risks</summary><ul>${r.risks.map(w => `<li>${esc(w)}</li>`).join("")}</ul></details>
    </div>`;
  }

  function decision(r) {
    const req = r.checks.filter(c => c.required);
    const met = req.filter(c => c.ok).length;
    const label = { BUY: "✓ BUY", WAIT: "✗ NOT BUY", AVOID: "✗ AVOID" }[r.action];
    return `<span class="decision ${r.action}">${label}</span><br><span class="muted">${met}/${req.length} conditions met</span>`;
  }

  function table(rows) {
    if (!rows.length) return `<div class="empty">None.</div>`;
    return `<div class="table-wrap"><table><thead><tr><th>Stock</th><th>Decision</th><th>Price</th><th>Buy up to</th><th>Stop</th><th>Target</th><th>Qty</th><th>Odds</th><th>Condition</th></tr></thead><tbody>` +
      rows.map(r => `<tr class="${r.action}"><td><b>${esc(r.symbol)}</b><br><span class="muted">${esc(r.exchange)}</span></td>
        <td>${decision(r)}</td>
        <td class="num">${num(r.ltp)}<br>${chg(r.change_pct)}</td><td class="num">${num(r.max_buy_price)}</td>
        <td class="num">${num(r.stop_loss)}</td><td class="num">${num(r.target)}</td>
        <td class="num">${r.position ? r.position.qty : "–"}<br><span class="muted">${money(r.position?.max_loss)} risk</span></td>
        <td class="num">${r.simulation?.simulation ? `${r.simulation.simulation.target_first_pct}% / ${r.simulation.simulation.stop_first_pct}%<br><span class="muted">target / stop first</span>` : "–"}</td>
        <td>${r.action === "BUY" ? `✓ All conditions met since ${esc(r.buy_since)}`
          : r.checks.filter(c => c.required && !c.ok).map(c => `✗ ${esc(c.detail)}`).join("<br>") || "No live price yet"}
          <details><summary>All checks and why it was picked</summary>${checks(r.checks)}<ul>${r.why_picked.map(w => `<li>${esc(w)}</li>`).join("")}</ul></details></td></tr>`).join("") +
      `</tbody></table></div>`;
  }

  async function getJson(url) {
    const res = await fetch(url);
    const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
    if (!res.ok) throw new Error(data.error || data.detail || JSON.stringify(data));
    return data;
  }

  function showFeed(data, what) {
    const f = data.feed;
    $("#feed").className = `pill ${f.connected ? "live" : "off"}`;
    $("#feed").textContent = f.connected ? `live · ${f.subscribed} ${what}` : "price feed reconnecting (using quotes)";
    $("#foot").textContent = data.disclaimer + " No orders are placed.";
  }

  // ---------- options ----------
  const OPT_LABEL = { BUY: "✓ BUY", ADD: "✓ ADD", HOLD: "HOLD", BOOK: "BOOK PROFIT", WAIT: "✗ NOT BUY", EXIT: "✗ EXIT", SKIP: "✗ SKIP" };
  const charts = {};  // chart id -> {pts, x, y, W, H} for the hover layer
  const hhmm = t => new Date(t * 1000).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false });

  function chart(id, leg) {
    const pts = leg.history || [];
    if (pts.length < 2) return `<div class="empty">Chart starts once prices arrive.</div>`;
    const W = 640, H = 220, L = 8, R = 78, T = 10, B = 22;
    // Show the entry, stops and the next unhit target or two, so far targets don't flatten the line.
    const nextT = leg.targets.slice(0, Math.min(leg.targets.length, leg.targets_hit + 2));
    const lvls = [
      { cls: "entry", v: leg.entry, label: `Entry ${num(leg.entry)}` },
      { cls: "stop", v: leg.stop_loss, label: `SL ${num(leg.stop_loss)}` },
      ...(leg.trail_stop != null && leg.trail_stop !== leg.stop_loss ? [{ cls: "trail", v: leg.trail_stop, label: `Trail ${num(leg.trail_stop)}` }] : []),
      ...nextT.map((t, i) => ({ cls: "target", v: t, label: `T${i + 1} ${num(t)}` })),
    ];
    const vals = pts.map(p => p[1]).concat(lvls.map(l => l.v));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
    const t0 = pts[0][0], t1 = Math.max(pts[pts.length - 1][0], t0 + 60);
    const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
    const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    charts[id] = { pts, x, y, W, H };
    const step = (t1 - t0) > 3 * 3600 ? 3600 : 1800;
    let grid = "", tickText = "";
    for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
      grid += `<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H - B}"/>`;
      tickText += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${hhmm(t)}</text>`;
    }
    // Level labels on the right, pushed apart so they never overlap.
    const placed = lvls.map(l => ({ ...l, ly: y(l.v) })).sort((a, b) => a.ly - b.ly);
    for (let i = 1; i < placed.length; i++) placed[i].ly = Math.max(placed[i].ly, placed[i - 1].ly + 12);
    const lines = placed.map(l => `<g class="lvl ${l.cls}"><line x1="${L}" x2="${W - R + 4}" y1="${y(l.v)}" y2="${y(l.v)}"/>` +
      `<text x="${W - R + 8}" y="${l.ly + 4}">${esc(l.label)}</text></g>`).join("");
    const path = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
    const last = pts[pts.length - 1];
    return `<div class="chart" data-chart="${id}">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(leg.symbol)} price today, last ${num(last[1])}">
        <g class="grid">${grid}</g>${lines}
        <path class="price" d="${path}"/>
        <circle class="dot" cx="${x(last[0])}" cy="${y(last[1])}" r="4"/>
        <g class="axis">${tickText}</g>
        <line class="cross" y1="${T}" y2="${H - B}" visibility="hidden"/>
        <circle class="dot hover" r="4" visibility="hidden"/>
        <rect x="0" y="0" width="${W - R}" height="${H}" fill="transparent"/>
      </svg><div class="tip" hidden></div></div>`;
  }

  // One delegated hover layer: the crosshair snaps to the nearest recorded price.
  document.addEventListener("pointermove", e => {
    const box = e.target.closest ? e.target.closest(".chart") : null;
    document.querySelectorAll(".chart").forEach(c => {
      if (c === box) return;
      c.querySelector(".tip")?.setAttribute("hidden", "");
      c.querySelector(".cross")?.setAttribute("visibility", "hidden");
      c.querySelector(".dot.hover")?.setAttribute("visibility", "hidden");
    });
    if (!box) return;
    const c = charts[box.dataset.chart], svg = box.querySelector("svg");
    if (!c || !svg) return;
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX - r.left) * c.W / r.width;
    let best = c.pts[0];
    for (const p of c.pts) if (Math.abs(c.x(p[0]) - sx) < Math.abs(c.x(best[0]) - sx)) best = p;
    const px = c.x(best[0]), py = c.y(best[1]);
    const cross = box.querySelector(".cross"), dot = box.querySelector(".dot.hover"), tip = box.querySelector(".tip");
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    tip.textContent = `${new Date(best[0] * 1000).toLocaleTimeString("en-IN", { hour12: false })} · ${num(best[1])}`;
    tip.hidden = false;
    const left = px * r.width / c.W, top = py * r.height / c.H;
    tip.style.left = `${Math.max(0, Math.min(left + 10, r.width - tip.offsetWidth))}px`;
    tip.style.top = `${Math.max(top - 34, 0)}px`;
  });

  function optChecks(list) {
    return `<ul class="checks">${list.map(c => `<li><span class="${c.ok ? "y" : "n"}">${c.ok ? "✓" : "✗"}</span> <b>${esc(c.name)}</b>: ${esc(c.detail)}</li>`).join("")}</ul>`;
  }

  function optDecision(l) {
    const met = (l.checks || []).filter(c => c.ok).length;
    return `<span class="decision ${l.action}">${OPT_LABEL[l.action] || esc(l.action)}</span>` +
      (l.checks ? `<br><span class="muted">${met}/${l.checks.length} conditions met</span>` : "");
  }

  function renderOptions(data) {
    const legs = [], pending = [];
    for (const [rule, title] of [["square", "Square (15-min)"], ["bounce_back", "Bounce back (1-hour)"]]) {
      const d = data[rule];
      if (!d.legs.length) pending.push(`${title}: levels from ${d.available_from}`);
      else d.legs.forEach(l => legs.push({ ...l, rule: title }));
    }
    const order = { ADD: 0, BUY: 1, HOLD: 2, WAIT: 3, BOOK: 4, SKIP: 5, EXIT: 6 };
    legs.sort((a, b) => (order[a.action] ?? 9) - (order[b.action] ?? 9));
    $("#opt-index").textContent = `${data.underlying} ${num(data.index.ltp)}` +
      (data.index.first_15m_close ? ` · first 15-min close ${num(data.index.first_15m_close)}` : "") +
      (data.index.first_hour_close ? ` · first-hour close ${num(data.index.first_hour_close)}` : "") +
      (pending.length ? ` · ${pending.join(" · ")}` : "");
    const count = acts => legs.filter(l => acts.includes(l.action)).length;
    const buys = count(["BUY", "ADD"]);
    $("#n-buy").textContent = `BUY/ADD ${buys}`;
    $("#n-wait").textContent = `WAIT/HOLD ${count(["WAIT", "HOLD"])}`;
    $("#n-avoid").textContent = `EXIT ${count(["EXIT", "SKIP"])}`;
    if (!legs.length) {
      $("#opt-table").innerHTML = `<div class="empty">${esc(data.market === "closed" ? `Market is closed. ${pending.join(" · ")}` : `No option levels yet. ${pending.join(" · ")}`)}</div>`;
      $("#opt-cards").innerHTML = "";
      return buys;
    }
    $("#opt-table").innerHTML = `<div class="table-wrap"><table><thead><tr><th>Option</th><th>Rule</th><th>Decision</th><th>Price</th><th>Entry</th><th>Stop</th><th>Targets</th><th>Condition</th></tr></thead><tbody>` +
      legs.map(l => `<tr class="${l.action}"><td><b>${esc(l.symbol || `${l.strike} ${l.type}`)}</b><br><span class="muted">${l.lotsize ? `lot ${l.lotsize}` : ""}</span></td>
        <td>${esc(l.rule)}</td><td>${optDecision(l)}</td><td class="num">${num(l.ltp)}</td><td class="num">${num(l.entry)}</td>
        <td class="num">${num(l.trail_stop ?? l.stop_loss)}</td>
        <td class="num">${l.targets ? l.targets.map((t, i) => i < l.targets_hit ? `<s>${num(t)}</s>` : num(t)).join(" / ") : "–"}</td>
        <td>${esc(l.advice)}</td></tr>`).join("") + `</tbody></table></div>`;
    $("#opt-cards").innerHTML = `<h2>Live charts</h2><div class="legend"><span><i style="border-color:var(--accent)"></i>price</span>
        <span><i style="border-color:var(--text);border-top-style:dashed"></i>entry</span><span><i style="border-color:#d03b3b;border-top-style:dashed"></i>stop loss</span>
        <span><i style="border-color:#ec835a;border-top-style:dotted"></i>trailing stop</span><span><i style="border-color:#0ca30c;border-top-style:dotted"></i>targets</span></div>
      <div class="grid" style="margin-top:10px">` + legs.filter(l => l.targets).map((l, i) => `
      <div class="card ${l.action}">
        <div class="card-head"><h3>${esc(l.symbol)}</h3><span class="decision ${l.action}">${OPT_LABEL[l.action] || esc(l.action)}</span>
          <span class="price">${num(l.ltp)}</span></div>
        <span class="muted">${esc(l.rule)} · expiry ${esc(l.expiry)} · lot ${l.lotsize}${l.entered_at ? ` · entered ${esc(l.entered_at)}` : ""}${l.targets_hit ? ` · ${l.targets_hit} targets hit` : ""}</span>
        ${chart(`leg${i}`, l)}
        <div class="advice">${esc(l.advice)}</div>
        <b>Conditions</b>${optChecks(l.checks || [])}
      </div>`).join("") + `</div>`;
    return buys;
  }

  async function refreshOptions() {
    const data = await getJson(`${URL_OPTIONS}?underlying=${$("#underlying").value}`);
    const n = renderOptions(data);
    showFeed(data, "prices");
    $("#clock").textContent = `${data.time} · market ${data.market}`;
    document.title = n ? `(${n}) Live Options` : "Live Options";
  }

  async function refresh() {
    if (busy) return;
    busy = true;
    try {
      if (tab === "options") { await refreshOptions(); $("#error").innerHTML = ""; return; }
      const data = await getJson(`${URL_EQUITY}?count=${$("#count").value}`);
      $("#error").innerHTML = "";
      const by = a => data.suggestions.filter(r => r.action === a);
      const buys = by("BUY");
      const isNew = r => seenBuy !== null && !seenBuy.has(r.symbol);
      $("#buy").innerHTML = buys.length ? `<div class="grid">${buys.map(r => buyCard(r, isNew(r))).join("")}</div>`
        : `<div class="empty">${esc(data.message || (data.market === "open"
            ? "No stock meets every condition right now. The watch list below shows what each one is missing."
            : data.market === "opening" ? "Opening 15 minutes: buys are only suggested from 09:30."
            : "Market is closed. Buys are suggested between 09:30 and 15:30."))}</div>`;
      $("#all").innerHTML = table(data.suggestions);  // already sorted: BUY, then closest to qualifying
      seenBuy = new Set(buys.map(r => r.symbol));

      showFeed(data, "stocks");
      $("#n-buy").textContent = `BUY ${data.counts.BUY}`;
      $("#n-wait").textContent = `WAIT ${data.counts.WAIT}`;
      $("#n-avoid").textContent = `AVOID ${data.counts.AVOID}`;
      $("#clock").textContent = `${data.time} · market ${data.market} · plan from ${data.plan_as_of} close`;
      document.title = buys.length ? `(${buys.length}) Live Buys` : "Live Buys";
    } catch (err) {
      $("#error").innerHTML = `<div class="err"></div>`;
      $("#error .err").textContent = `Refresh failed: ${err.message}. Retrying…`;
    } finally {
      busy = false;
    }
  }

  $("#count").addEventListener("change", () => { seenBuy = null; refresh(); });
  $("#underlying").addEventListener("change", () => {
    $("#opt-table").innerHTML = '<div class="empty"><span class="spinner"></span>Loading…</div>';
    $("#opt-cards").innerHTML = "";
    refresh();
  });
  function showTab(name) {
    tab = name;
    document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === name));
    document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== name);
    document.querySelectorAll("[data-only]").forEach(p => p.hidden = p.dataset.only !== name);
    try { localStorage.setItem("live-tab", name); } catch {}
  }
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { showTab(b.dataset.tab); refresh(); }));
  try { const saved = localStorage.getItem("live-tab"); if (saved === "options") showTab(saved); } catch {}
  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
